<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Tidak Ditemukan - Nexabrick Sensor Catalog</title>
    <meta name="robots" content="noindex">
    <style>
        :root {
            --bg: #090d14;
            --text: #edf3fb;
            --text-muted: #748299;
            --accent: #54a7ff;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { font-size: 4rem; margin: 0; }
        p { color: var(--text-muted); margin-bottom: 2rem; }
        a {
            color: var(--bg);
            background-color: var(--accent);
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 500;
        }
        a:hover { filter: brightness(1.1); }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>Data atau sensor yang Anda cari tidak ditemukan.</p>
    <a id="home-link" href="./">Kembali ke Katalog Utama</a>
    <script>
      // Resolve the Pages base path dynamically (project site + repo sub-path)
      (function () {
        var link = document.getElementById('home-link');
        var segments = location.pathname.split('/').filter(Boolean);
        var candidates = [location.origin + '/'];
        for (var i = 0; i <= segments.length; i++) {
          candidates.push(location.origin + '/' + segments.slice(0, i).join('/') + '/');
        }
        // Check from deepest candidate up; first that serves index.html is the app root
        var check = function (root) {
          return fetch(root + 'index.html').then(function (r) { return r.ok; });
        };
        (function walk(i) {
          if (i < 0) { link.href = candidates[0]; return; }
          check(candidates[i]).then(function (ok) {
            if (ok) { link.href = candidates[i]; }
            else { walk(i - 1); }
          });
        })(candidates.length - 1);
      })();
    </script>
</body>
</html>
