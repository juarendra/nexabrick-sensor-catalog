name: Validate Catalog

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Validator
        run: node scripts/validate-catalog.mjs
      - name: Run Test Suite
        run: node --test "tests/*.test.mjs"